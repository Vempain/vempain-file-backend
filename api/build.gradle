plugins {
	id 'java-library'
	alias(libs.plugins.freefair.lombok)
	id 'maven-publish'
	id "jacoco"
}

def apiArtifactName = "${rootProject.name}-api"

repositories {
	maven {
		url = "https://maven.pkg.github.com/Vempain/vempain-auth"
		credentials {
			username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
			password = project.findProperty("gpr.token") ?: System.getenv("GITHUB_TOKEN")
		}
	}
	mavenCentral()
}

group = 'fi.poltsi.vempain'
version = libs.versions.release.get()

jar {
	archiveFileName = "${apiArtifactName}-${version}.jar"
}

java {
	// Attach sources and javadoc for Maven consumers
	withSourcesJar()
	withJavadocJar()
}

// Quiet javadoc warnings as we're using Lombok which does not generate documentation for the generated methods
tasks.withType(Javadoc).configureEach {
	options.addStringOption('Xdoclint:all,-missing', '-quiet') // keep other checks, ignore missing docs
}

dependencies {
	api "org.springframework.boot:spring-boot-starter-data-jpa:${libs.versions.spring.boot.get()}"
	api "org.springframework.boot:spring-boot-starter-webmvc:${libs.versions.spring.boot.get()}"
	api "org.springframework.boot:spring-boot-starter-jackson:${libs.versions.spring.boot.get()}"
	api "org.springframework.boot:spring-boot-starter-validation:${libs.versions.spring.boot.get()}"
	// This needs to be built first in vempain-auth
	api "fi.poltsi.vempain:vempain-auth-api:${libs.versions.vempain.auth.get()}"
	api "fi.poltsi.vempain:vempain-admin-backend-api:${libs.versions.vempain.admin.get()}"
	implementation "io.swagger.core.v3:swagger-annotations:${libs.versions.swagger.get()}"
	testImplementation "org.mockito:mockito-junit-jupiter:${libs.versions.mockito.get()}"
	testImplementation "org.junit.jupiter:junit-jupiter:${libs.versions.junit.get()}"
	testImplementation "org.junit.platform:junit-platform-launcher:${libs.versions.junit.get()}"
}

// Publish the API module to GitHub Packages when invoked by CI
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
			groupId = project.group
			artifactId = apiArtifactName
			version = project.version
			pom {
				name = apiArtifactName
				description = "Public API (DTOs and interfaces) for Vempain File backend"
				url = "https://github.com/Vempain/${rootProject.name}"
				licenses {
					license {
						name = "GPL-2.0 License"
						url = "https://www.gnu.org/licenses/old-licenses/gpl-2.0.en.html"
					}
				}
				scm {
					url = "https://github.com/Vempain/${rootProject.name}"
				}
			}
		}
	}
	repositories {
		maven {
			name = "GitHubPackages"
			url = uri("https://maven.pkg.github.com/Vempain/${rootProject.name}")
			credentials {
				username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
				password = project.findProperty("gpr.token") ?: System.getenv("GITHUB_TOKEN")
			}
		}
	}
}

jacoco {
	toolVersion = libs.versions.jacoco.get()
}

tasks.named('test') {
	useJUnitPlatform()
}

test {
	finalizedBy jacocoTestReport
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
	}
}
