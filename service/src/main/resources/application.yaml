---
spring:
  docker:
    compose:
      enabled: false
  name: Vempain File Service
  servlet:
    session:
      timeout: 600
  session:
    store-type: jdbc
    jdbc:
      table-name: server_sessions
      cleanup-cron: "5 * * * * *"
      initialize-schema: always
  datasource:
    url: override-me
    driver-class-name: org.postgresql.Driver
    username: override-me
    password: override-me
  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    default-schema: vempain_file
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: native
  servlet:
    context-path: /api

actuator:
  enabled: true
  endpoints:
    web:
      exposure:
        include: health

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  metrics:
    tags:
      application: vempain-file-backend
  prometheus:
    metrics:
      export:
        enabled: ${ENV_PROMETHEUS_ENABLED:true}
        step: ${ENV_PROMETHEUS_STEP:1m}
        descriptions: true

springdoc:
  show-login-endpoint: true
  swagger-ui:
    operationsSorter: alpha
    tagsSorter: alpha
  show-actuator: true
  api-docs:
    enabled: true
    resolve-schema-properties: true
  use-management-port: true

logging:
  level:
    root: WARN
    fi:
      poltsi: INFO

vempain:
  scheduling:
    enabled: ${VEMPAIN_SCHEDULING_ENABLED:true}
  developer:
    name: "Paul-Erik Törrönen"
    url: "https://poltsi.fi/"
    email: "poltsi@poltsi.fi"
  type: "Vempain File backend service"
  description: "Vempain File backend serves the REST API for the frontend"
  version: @projectVersion@
  license: "GPL 2.0"
  license-url: "https://www.gnu.org/licenses/old-licenses/gpl-2.0.html"
  app:
    frontend-url: override-me
    jwt-secret: override-me
    jwt-expiration-ms: 900000
  cors:
    allowed-origins: ${vempain.app.frontend-url}
    cors-pattern: '/**'
    max-age: 3600
  original-root-directory: override-me
  export-root-directory: override-me
  path-completion:
    # Collation used to sort the directory completions of the import view (BCP 47 tag); fi puts å, ä and ö after z
    collation-locale: fi
  export-file-type: jpeg
  service:
    admin-backend-url: override-me
    # Service-to-service API token created in the admin UI (Administration > API tokens); sent as X-Vempain-Api-Token
    admin-backend-api-token: override-me
  site-image-size: 1400
  site-video-size: 720p
  refresh-updated-files:
    enabled: true
    cron: "0 0 * * * *"
  acl-repair:
    enabled: true
    cron: "0 30 3 * * *"
  tasks:
    # Durable PostgreSQL task facility (publish, scan, data sets, tag rewrites)
    worker-count: ${VEMPAIN_TASK_WORKER_COUNT:4}
    retention-minutes: 120
    cleanup-interval-ms: 60000
    poll-interval-ms: ${VEMPAIN_TASK_POLL_INTERVAL_MS:1000}
    heartbeat-interval-ms: ${VEMPAIN_TASK_HEARTBEAT_INTERVAL_MS:10000}
    lease-seconds: ${VEMPAIN_TASK_LEASE_SECONDS:60}
  generate-missing-thumbnails:
    batch-size: 1000
    worker-count: ${VEMPAIN_THUMBNAIL_WORKER_COUNT:#{T(java.lang.Runtime).getRuntime().availableProcessors()}}
    thumb-image-size: 250
    thumb-image-quality: 0.7
    video-capture-percentage: 0.3
    enabled: true
    cron: "0 0 * * * *"
  queue-missing-video-exports:
    batch-size: 1000
    worker-count: ${VEMPAIN_VIDEO_QUEUE_WORKER_COUNT:#{T(java.lang.Runtime).getRuntime().availableProcessors()}}
    enabled: true
    cron: "0 0 * * * *"
  file-processing:
    enabled: true
    batch-size: 100
    worker-count: ${VEMPAIN_FILE_PROCESSING_WORKER_COUNT:#{T(java.lang.Runtime).getRuntime().availableProcessors()}}
    cron: "0 0 * * * *"
    video:
      width: 1280
      height: 720
      fps: 30
      audio-bitrate: 128000
      audio-codec: vorbis
      video-codec: mpeg4
      container: mp4
      quality: 23

---
### Local machine ###

spring:
  config:
    activate:
      on-profile: local
    import: classpath:local.yaml

---
### Production server ###

spring:
  config:
    activate:
      on-profile: prod
    import: classpath:prod.yaml
